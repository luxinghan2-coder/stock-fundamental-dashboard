<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>股票基本面驾驶舱</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5f6f8;
            color: #111;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Microsoft YaHei",
                Arial,
                sans-serif;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            margin: 0 0 6px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 20px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            background: white;
        }

        button {
            padding: 14px 22px;
            border: none;
            border-radius: 10px;
            background: #111;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:active {
            opacity: .75;
        }

        .status {
            margin-bottom: 16px;
            color: #666;
            min-height: 20px;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 18px;
            box-shadow:
                0 2px 10px rgba(0,0,0,.05);
        }

        .company-name {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .company-meta {
            color: #666;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .grid {
            display: grid;
            grid-template-columns:
                repeat(3, minmax(0, 1fr));
            gap: 12px;
        }

        .metric {
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 14px;
            background: #fafafa;
        }

        .metric-name {
            color: #666;
            font-size: 14px;
            margin-bottom: 6px;
        }

        .metric-value {
            font-size: 21px;
            font-weight: 700;
            word-break: break-word;
        }

        .chart-wrapper {
            position: relative;
            height: 380px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 11px 10px;
            border-bottom: 1px solid #eee;
            text-align: right;
        }

        th:first-child,
        td:first-child {
            text-align: left;
        }

        th {
            background: #fafafa;
        }

        .empty {
            color: #888;
            padding: 20px 0;
            text-align: center;
        }

        .source {
            color: #666;
            font-size: 14px;
            line-height: 1.8;
        }

        @media (max-width: 700px) {

            .container {
                padding: 14px;
            }

            h1 {
                font-size: 24px;
            }

            .search-box {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

            .grid {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }

            .chart-wrapper {
                height: 300px;
            }

            .metric-value {
                font-size: 18px;
            }
        }

        @media (max-width: 420px) {

            .grid {
                grid-template-columns: 1fr;
            }
        }

    </style>
</head>

<body>

<div class="container">

    <h1>股票基本面驾驶舱</h1>

    <div class="subtitle">
        A股 · 港股 · 美股｜估值 · 盈利 · 现金流 · ROE
    </div>

    <div class="search-box">

        <input
            id="symbol"
            value="AAPL"
            placeholder="输入股票代码，例如 AAPL / 600519 / 0700.HK"
        >

        <button id="query">
            查询
        </button>

    </div>

    <div
        id="status"
        class="status"
    >
        准备查询
    </div>


    <!-- 公司 -->

    <div class="card">

        <div
            id="company"
            class="company-name"
        >
            —
        </div>

        <div
            id="companyMeta"
            class="company-meta"
        >
            —
        </div>

    </div>


    <!-- 估值 -->

    <div class="card">

        <div class="section-title">
            估值与核心指标
        </div>

        <div class="grid">

            <div class="metric">
                <div class="metric-name">
                    当前价格
                </div>
                <div
                    id="price"
                    class="metric-value"
                >
                    —
                </div>
            </div>

            <div class="metric">
                <div class="metric-name">
                    PE
                </div>
                <div
                    id="pe"
                    class="metric-value"
                >
                    —
                </div>
            </div>

            <div class="metric">
                <div class="metric-name">
                    PB
                </div>
                <div
                    id="pb"
                    class="metric-value"
                >
                    —
                </div>
            </div>

            <div class="metric">
                <div class="metric-name">
                    ROE
                </div>
                <div
                    id="roe"
                    class="metric-value"
                >
                    —
                </div>
            </div>

            <div class="metric">
                <div class="metric-name">
                    ROE ÷ PB
                </div>
                <div
                    id="roePb"
                    class="metric-value"
                >
                    —
                </div>
            </div>

            <div class="metric">
                <div class="metric-name">
                    PE ÷ ROE
                </div>
                <div
                    id="peRoe"
                    class="metric-value"
                >
                    —
                </div>
            </div>

        </div>

    </div>


    <!-- 基本面 -->

    <div class="card">

        <div class="section-title">
            公司基本面
        </div>

        <div class="grid">

            <div class="metric">
                <div class="metric-name">
                    营收
                </div>
                <div
                    id="revenue"
                    class="metric-value"
                >
                    —
                </div>
            </div>

            <div class="metric">
                <div class="metric-name">
                    净利润
                </div>
                <div
                    id="netIncome"
                    class="metric-value"
                >
                    —
                </div>
            </div>

            <div class="metric">
                <div class="metric-name">
                    毛利率
                </div>
                <div
                    id="grossMargin"
                    class="metric-value"
                >
                    —
                </div>
            </div>

            <div class="metric">
                <div class="metric-name">
                    自由现金流
                </div>
                <div
                    id="fcf"
                    class="metric-value"
                >
                    —
                </div>
            </div>

            <div class="metric">
                <div class="metric-name">
                    股息率
                </div>
                <div
                    id="dividendYield"
                    class="metric-value"
                >
                    —
                </div>
            </div>

            <div class="metric">
                <div class="metric-name">
                    资产负债率
                </div>
                <div
                    id="debtRatio"
                    class="metric-value"
                >
                    —
                </div>
            </div>

        </div>

    </div>


    <!-- ROE 折线图 -->

    <div class="card">

        <div class="section-title">
            15年 ROE 趋势
        </div>

        <div
            id="chartEmpty"
            class="empty"
            style="display:none;"
        >
            暂无足够的历史 ROE 数据
        </div>

        <div
            id="chartContainer"
            class="chart-wrapper"
        >
            <canvas id="roeChart"></canvas>
        </div>

    </div>


    <!-- ROE统计 -->

    <div class="card">

        <div class="section-title">
            15年 ROE 统计
        </div>

        <div class="grid">

            <div class="metric">
                <div class="metric-name">
                    有效年度
                </div>
                <div
                    id="roeCount"
                    class="metric-value"
                >
                    —
                </div>
            </div>

            <div class="metric">
                <div class="metric-name">
                    平均 ROE
                </div>
                <div
                    id="roeAverage"
                    class="metric-value"
                >
                    —
                </div>
            </div>

            <div class="metric">
                <div class="metric-name">
                    ROE 中位数
                </div>
                <div
                    id="roeMedian"
                    class="metric-value"
                >
                    —
                </div>
            </div>

            <div class="metric">
                <div class="metric-name">
                    标准差
                </div>
                <div
                    id="roeStd"
                    class="metric-value"
                >
                    —
                </div>
            </div>

            <div class="metric">
                <div class="metric-name">
                    ROE 极差
                </div>
                <div
                    id="roeRange"
                    class="metric-value"
                >
                    —
                </div>
            </div>

            <div class="metric">
                <div class="metric-name">
                    最高 ROE
                </div>
                <div
                    id="roeMax"
                    class="metric-value"
                >
                    —
                </div>
            </div>

            <div class="metric">
                <div class="metric-name">
                    最低 ROE
                </div>
                <div
                    id="roeMin"
                    class="metric-value"
                >
                    —
                </div>
            </div>

        </div>

    </div>


    <!-- ROE 年度明细 -->

    <div class="card">

        <div class="section-title">
            15年 ROE 年度明细
        </div>

        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>
                        <th>年度</th>
                        <th>ROE</th>
                    </tr>

                </thead>

                <tbody id="roeTable">

                </tbody>

            </table>

        </div>

    </div>


    <!-- 数据来源 -->

    <div class="card">

        <div class="section-title">
            数据来源
        </div>

        <div
            id="source"
            class="source"
        >
            —
        </div>

    </div>

</div>


<script>

let roeChart = null;


function formatNumber(value) {

    if (
        value === null ||
        value === undefined ||
        Number.isNaN(Number(value))
    ) {
        return "暂无数据";
    }

    return Number(value).toLocaleString(
        "zh-CN",
        {
            maximumFractionDigits: 2
        }
    );
}


function formatPercent(value) {

    if (
        value === null ||
        value === undefined ||
        Number.isNaN(Number(value))
    ) {
        return "暂无数据";
    }

    return Number(value).toFixed(2) + "%";
}


function formatMoney(value) {

    if (
        value === null ||
        value === undefined ||
        Number.isNaN(Number(value))
    ) {
        return "暂无数据";
    }

    const n = Number(value);

    const abs = Math.abs(n);

    if (abs >= 1e12) {
        return (n / 1e12).toFixed(2) + "T";
    }

    if (abs >= 1e9) {
        return (n / 1e9).toFixed(2) + "B";
    }

    if (abs >= 1e6) {
        return (n / 1e6).toFixed(2) + "M";
    }

    return n.toLocaleString(
        "zh-CN",
        {
            maximumFractionDigits: 2
        }
    );
}


function setText(id, value) {

    const element =
        document.getElementById(id);

    if (element) {
        element.textContent = value;
    }
}


function renderRoeChart(rows) {

    const chartContainer =
        document.getElementById(
            "chartContainer"
        );

    const chartEmpty =
        document.getElementById(
            "chartEmpty"
        );

    if (
        !rows ||
        !Array.isArray(rows) ||
        rows.length === 0
    ) {

        chartContainer.style.display =
            "none";

        chartEmpty.style.display =
            "block";

        if (roeChart) {
            roeChart.destroy();
            roeChart = null;
        }

        return;
    }

    chartContainer.style.display =
        "block";

    chartEmpty.style.display =
        "none";


    const labels = rows.map(
        row => String(row.year)
    );

    const values = rows.map(
        row => Number(row.roe)
    );


    const canvas =
        document.getElementById(
            "roeChart"
        );

    if (roeChart) {
        roeChart.destroy();
    }


    roeChart = new Chart(
        canvas,
        {
            type: "line",

            data: {

                labels: labels,

                datasets: [
                    {
                        label: "ROE",

                        data: values,

                        tension: 0.25,

                        borderWidth: 2,

                        pointRadius: 4,

                        pointHoverRadius: 6,

                        fill: false
                    }
                ]
            },

            options: {

                responsive: true,

                maintainAspectRatio: false,

                interaction: {
                    mode: "index",
                    intersect: false
                },

                plugins: {

                    legend: {
                        display: true
                    },

                    tooltip: {

                        callbacks: {

                            label: function(context) {

                                return (
                                    "ROE: "
                                    +
                                    Number(
                                        context.raw
                                    ).toFixed(2)
                                    +
                                    "%"
                                );

                            }

                        }

                    }

                },

                scales: {

                    x: {

                        title: {
                            display: true,
                            text: "年度"
                        }

                    },

                    y: {

                        title: {
                            display: true,
                            text: "ROE"
                        },

                        ticks: {

                            callback:
                                function(value) {
                                    return value + "%";
                                }

                        }

                    }

                }

            }

        }
    );
}


function renderRoeTable(rows) {

    const table =
        document.getElementById(
            "roeTable"
        );

    table.innerHTML = "";


    if (
        !rows ||
        rows.length === 0
    ) {

        table.innerHTML =
            '<tr><td colspan="2" class="empty">暂无数据</td></tr>';

        return;
    }


    rows.forEach(
        row => {

            const tr =
                document.createElement(
                    "tr"
                );

            tr.innerHTML = `
                <td>${row.year}</td>
                <td>${formatPercent(row.roe)}</td>
            `;

            table.appendChild(tr);

        }
    );

}


async function queryStock() {

    const input =
        document.getElementById(
            "symbol"
        );

    const button =
        document.getElementById(
            "query"
        );

    const status =
        document.getElementById(
            "status"
        );


    const symbol =
        input.value.trim();


    if (!symbol) {

        status.textContent =
            "请输入股票代码";

        return;
    }


    button.disabled = true;

    button.textContent =
        "查询中...";

    status.textContent =
        "正在获取数据，请稍候...";


    try {

        const response =
            await fetch(
                "/api/stock/"
                +
                encodeURIComponent(
                    symbol
                ),
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP "
                +
                response.status
            );

        }


        const data =
            await response.json();


        console.log(
            "股票数据：",
            data
        );


        // 公司

        setText(
            "company",
            data.company || data.symbol || "—"
        );


        setText(
            "companyMeta",

            [
                data.symbol,
                data.exchange,
                data.currency
            ]
            .filter(Boolean)
            .join(" · ")
        );


        // 估值

        setText(
            "price",
            formatNumber(
                data.market_data?.price
            )
        );

        setText(
            "pe",
            formatNumber(
                data.valuation?.pe
            )
        );

        setText(
            "pb",
            formatNumber(
                data.valuation?.pb
            )
        );

        setText(
            "roe",
            formatPercent(
                data.valuation?.roe
            )
        );

        setText(
            "roePb",
            formatNumber(
                data.valuation?.roe_pb
            )
        );

        setText(
            "peRoe",
            formatNumber(
                data.valuation?.pe_roe
            )
        );


        // 基本面

        setText(
            "revenue",
            formatMoney(
                data.fundamentals?.revenue
            )
        );

        setText(
            "netIncome",
            formatMoney(
                data.fundamentals?.net_income
            )
        );

        setText(
            "grossMargin",
            formatPercent(
                data.fundamentals?.gross_margin
            )
        );

        setText(
            "fcf",
            formatMoney(
                data.fundamentals?.free_cash_flow
            )
        );

        setText(
            "dividendYield",
            formatPercent(
                data.fundamentals?.dividend_yield
            )
        );

        setText(
            "debtRatio",
            formatPercent(
                data.fundamentals?.debt_ratio
            )
        );


        // ROE 统计

        const roeStats =
            data.roe_15y?.stats || {};


        setText(
            "roeCount",
            formatNumber(
                roeStats.count
            )
        );

        setText(
            "roeAverage",
            formatPercent(
                roeStats.average
            )
        );

        setText(
            "roeMedian",
            formatPercent(
                roeStats.median
            )
        );

        setText(
            "roeStd",
            formatPercent(
                roeStats.std_dev
            )
        );

        setText(
            "roeRange",
            formatPercent(
                roeStats.range
            )
        );

        setText(
            "roeMax",
            formatPercent(
                roeStats.max
            )
        );

        setText(
            "roeMin",
            formatPercent(
                roeStats.min
            )
        );


        // ROE 历史

        const roeRows =
            data.roe_15y?.years || [];


        renderRoeChart(
            roeRows
        );


        renderRoeTable(
            roeRows
        );


        // 数据来源

        const source =
            data.source || {};


        setText(
            "source",

            [
                "Provider: "
                +
                (
                    source.provider
                    ||
                    "Yahoo Finance HTTP API"
                ),

                source.data_as_of
                    ?
                    "Data as of: "
                    +
                    source.data_as_of
                    :
                    "",

                source.note
                    ||
                    ""
            ]
            .filter(Boolean)
            .join("\n")
        );


        status.textContent =
            "查询完成";


    } catch (error) {

        console.error(
            error
        );

        status.textContent =
            "查询失败："
            +
            error.message;

    } finally {

        button.disabled =
            false;

        button.textContent =
            "查询";

    }

}


// 查询按钮

document
    .getElementById("query")
    .addEventListener(
        "click",
        queryStock
    );


// Enter 查询

document
    .getElementById("symbol")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                queryStock();

            }

        }
    );


// 页面打开自动查询 AAPL

queryStock();

</script>

</body>
</html>
