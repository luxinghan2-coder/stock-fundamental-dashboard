<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>股票基本面驾驶舱</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f4f6f8;color:#15191e}
*{box-sizing:border-box}body{margin:0;background:#f4f6f8}.wrap{max-width:760px;margin:auto;padding:16px}
h1{font-size:25px;margin:6px 0 4px}.sub{color:#6b7280;font-size:13px;margin-bottom:16px}
.search{display:flex;gap:8px}.search input{flex:1;min-width:0;border:1px solid #d5d9df;border-radius:12px;padding:13px;font-size:16px;background:#fff}.search button{border:0;border-radius:12px;padding:0 18px;font-size:15px;background:#111827;color:white}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:16px;margin-top:12px;box-shadow:0 2px 10px #00000008}
.company{display:flex;justify-content:space-between;gap:10px}.company h2{margin:0;font-size:20px}.muted{color:#6b7280;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px}.metric{border:1px solid #edf0f2;border-radius:12px;padding:12px}.metric b{display:block;font-size:20px;margin-top:5px}.metric span{font-size:12px;color:#6b7280}
.section{font-size:15px;font-weight:700;margin-bottom:10px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f7f8fa;border-radius:10px;padding:9px}.stat span{display:block;color:#6b7280;font-size:11px}.stat b{font-size:16px}
.chartbox{width:100%;overflow:hidden}.chartbox svg{width:100%;height:250px;display:block}.status{margin-top:10px;color:#6b7280;font-size:12px}.error{color:#b42318}
.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:8px 4px;border-bottom:1px solid #eee;text-align:right}.table th:first-child,.table td:first-child{text-align:left}
@media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="wrap">
<h1>股票基本面驾驶舱</h1>
<div class="sub">A股 · 港股 · 美股｜V1｜历史ROE自动计算</div>
<div class="search"><input id="symbol" placeholder="输入 AAPL / 600519 / 0700" value="AAPL"><button onclick="loadStock()">查询</button></div>
<div id="status" class="status">输入股票代码后查询</div><div id="app"></div>
</div>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",""":"&quot;","'":"&#39;"}[m]));
const n=(x,d=2)=>x==null?"暂无数据":Number(x).toLocaleString("zh-CN",{maximumFractionDigits:d});
const pct=x=>x==null?"暂无数据":`${n(x)}%`;
const money=x=>x==null?"暂无数据":Number(x).toLocaleString("zh-CN",{maximumFractionDigits:0});
const metric=(a,b)=>`<div class="metric"><span>${a}</span><b>${b}</b></div>`;
const stat=(a,b)=>`<div class="stat"><span>${a}</span><b>${b}</b></div>`;

function lineChart(rows){
 if(!rows.length)return '<div class="status">暂无足够的15年年度数据</div>';
 const W=700,H=250,L=45,R=15,T=18,B=34, vals=rows.map(r=>r.roe);
 const min=Math.min(...vals),max=Math.max(...vals),pad=Math.max((max-min)*.15,1),lo=min-pad,hi=max+pad;
 const x=i=>L+i*(W-L-R)/Math.max(rows.length-1,1),y=v=>T+(hi-v)*(H-T-B)/(hi-lo);
 const pts=rows.map((r,i)=>`${x(i)},${y(r.roe)}`).join(" ");
 const labels=rows.map((r,i)=>`<text x="${x(i)}" y="${H-10}" text-anchor="middle" font-size="11" fill="#6b7280">${r.year}</text>`).join("");
 const dots=rows.map((r,i)=>`<circle cx="${x(i)}" cy="${y(r.roe)}" r="3.5" fill="#111827"><title>${r.year}: ${n(r.roe)}%</title></circle>`).join("");
 const grid=[0,.5,1].map(f=>{let v=lo+(hi-lo)*(1-f);return `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#e5e7eb"/><text x="${L-7}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#6b7280">${n(v,1)}%</text>`}).join("");
 return `<div class="chartbox"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${grid}<polyline points="${pts}" fill="none" stroke="#111827" stroke-width="2.5"/>${dots}${labels}</svg></div>`;
}
async function loadStock(){
 const s=document.getElementById("symbol").value.trim(),status=document.getElementById("status"),app=document.getElementById("app");
 if(!s){status.textContent="请输入股票代码";return}
 status.textContent="正在获取财务数据……";app.innerHTML="";
 try{
  const r=await fetch(`/api/stock/${encodeURIComponent(s)}`),d=await r.json();
  if(!r.ok)throw new Error(d.detail||"查询失败");
  const v=d.valuation,f=d.fundamentals,rs=d.roe_15y.stats,rows=d.roe_15y.years;
  app.innerHTML=`
  <div class="card"><div class="company"><div><h2>${esc(d.company)}</h2><div class="muted">${esc(d.symbol)} · ${esc(d.exchange||"")}</div></div><div style="text-align:right"><div class="muted">最新价格</div><b>${n(d.market_data.price)}</b></div></div></div>
  <div class="card"><div class="section">核心估值</div><div class="grid">
  ${metric("PE",n(v.pe))}${metric("PB",n(v.pb))}${metric("ROE",pct(v.roe))}${metric("ROE ÷ PB",n(v.roe_pb))}${metric("PE ÷ ROE",n(v.pe_roe))}</div></div>
  <div class="card"><div class="section">基本面</div><div class="grid">
  ${metric("营收",money(f.revenue))}${metric("净利润",money(f.net_income))}${metric("毛利率",pct(f.gross_margin))}${metric("自由现金流",money(f.free_cash_flow))}${metric("负债率",pct(f.debt_ratio))}${metric("股息率",pct(f.dividend_yield))}</div></div>
  <div class="card"><div class="section">近15年年度 ROE</div>
  <div class="stats">${stat("平均",pct(rs.average))}${stat("中位数",pct(rs.median))}${stat("标准差",pct(rs.std_dev))}${stat("极差",pct(rs.range))}${stat("最高",pct(rs.max))}${stat("最低",pct(rs.min))}</div>
  ${lineChart(rows)}<div class="muted">有效年度：${rs.count}/15｜${esc(d.roe_15y.definition)}</div></div>
  <div class="card"><div class="section">年度明细</div><table class="table"><thead><tr><th>年份</th><th>净利润</th><th>平均权益</th><th>ROE</th></tr></thead><tbody>
  ${rows.slice().reverse().map(x=>`<tr><td>${x.year}</td><td>${money(x.net_income)}</td><td>${money((x.equity_begin+x.equity_end)/2)}</td><td>${pct(x.roe)}</td></tr>`).join("")}
  </tbody></table></div>
  <div class="status">数据源：${esc(d.source.provider)}。历史财务数据以实际取得的有效年度为准。</div>`;
  status.textContent="查询完成";
 }catch(e){status.innerHTML=`<span class="error">${esc(e.message)}</span>`}
}
document.getElementById("symbol").addEventListener("keydown",e=>{if(e.key==="Enter")loadStock()});
</script>
</body></html>
