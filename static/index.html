<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>股票基本面驾驶舱 V1</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5f6f8;
            color: #111;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Microsoft YaHei",
                Arial,
                sans-serif;
        }

        .container {
            width: min(1200px, 94%);
            margin: 30px auto 60px;
        }

        h1 {
            margin: 0;
            font-size: 30px;
            font-weight: 700;
        }

        .subtitle {
            margin-top: 8px;
            color: #666;
            font-size: 14px;
        }

        .search-box {
            margin-top: 24px;
            background: white;
            padding: 18px;
            border-radius: 14px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.06);
            display: flex;
            gap: 10px;
        }

        .search-box input {
            flex: 1;
            min-width: 0;
            padding: 13px 15px;
            font-size: 16px;
            border: 1px solid #d8dce2;
            border-radius: 9px;
            outline: none;
        }

        .search-box input:focus {
            border-color: #111;
        }

        .search-box button {
            padding: 0 25px;
            border: 0;
            border-radius: 9px;
            background: #111;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .search-box button:disabled {
            opacity: 0.55;
            cursor: wait;
        }

        .status {
            margin-top: 12px;
            min-height: 22px;
            color: #666;
            font-size: 14px;
        }

        .error {
            color: #b00020;
        }

        .hidden {
            display: none;
        }

        .company-card {
            margin-top: 20px;
            background: white;
            padding: 22px;
            border-radius: 14px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.06);
        }

        .company-name {
            font-size: 25px;
            font-weight: 700;
        }

        .company-symbol {
            margin-top: 7px;
            color: #666;
            font-size: 14px;
        }

        .price {
            margin-top: 18px;
            font-size: 32px;
            font-weight: 700;
        }

        .section {
            margin-top: 22px;
        }

        .section-title {
            margin-bottom: 12px;
            font-size: 20px;
            font-weight: 700;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
