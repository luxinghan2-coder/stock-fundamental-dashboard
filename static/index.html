on:relative;height:30px;margin-top:6px}.target-line .track{position:absolute;left:0;right:0;top:14px;height:2px;background:#dfe3e8}.target-line .marker{position:absolute;top:8px;width:2px;height:14px;background:#111827}.target-line .label{position:absolute;top:0;font-size:10px;transform:translateX(-50%);white-space:nowrap}.target-line .label.current{font-weight:700}.target-line .label.edge-left{transform:none}.target-line .label.edge-right{transform:translateX(-100%)}.kchart{margin-top:14px;border:1px solid #e7eaee;border-radius:14px;background:#fff;overflow:hidden}.khead{display:flex;justify-content:space-between;gap:8px;padding:10px 10px 5px;font-size:11px;color:#66707c}.khead b{font-size:15px;color:#15191e}.klegend{display:flex;gap:10px;flex-wrap:wrap;padding:4px 10px 8px;font-size:10px;color:#737b86}.klegend span{display:inline-flex;align-items:center;gap:4px}.klegend i{width:10px;height:3px;border-radius:2px;display:inline-block}.kchart svg{width:100%;height:340px;display:block;background:#fff}.news-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}.news-item{padding:10px 11px;border-radius:10px;background:#f7f8fa;border:1px solid #eef0f2}.news-top{display:flex;align-items:center;gap:7px;margin-bottom:5px}.news-tag{font-size:10px;font-weight:700;padding:2px 6px;border-radius:999px}.news-tag.pos{background:#d9f7df;color:#137333}.news-tag.neg{background:#ffe0e3;color:#a61b29}.news-tag.neu{background:#e8eaed;color:#5f6368}.news-meta{font-size:10px;color:#8a929d}.news-title{display:block;color:#15191e;text-decoration:none;font-size:13px;line-height:1.5;font-weight:600}.news-title:active{text-decoration:underline}.news-note{margin-top:8px;font-size:10px;color:#8a929d;line-height:1.5}.news-empty{padding:12px;background:#f7f8fa;border-radius:10px;color:#8a929d;font-size:12px}@media(max-width:520px){.khead{font-size:10px}.khead>div:last-child{white-space:nowrap}.kchart svg{height:315px}.klegend{gap:7px}}.scan-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.scan-btn{border:0;border-radius:11px;padding:10px 14px;background:#111827;color:#fff;font-weight:700}.scan-btn:disabled{opacity:.55}.scan-filters{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.scan-filter{border:1px solid #d8dde3;background:#fff;border-radius:999px;padding:6px 10px;font-size:12px}.scan-filter.active{background:#111827;color:#fff;border-color:#111827}.scan-row{display:grid;grid-template-columns:30px 1fr auto;gap:9px;align-items:center;padding:11px 0;border-bottom:1px solid #eef0f2}.scan-row:last-child{border-bottom:0}.scan-rank{font-weight:800;color:#6b7280}.scan-name{font-weight:700}.scan-meta{font-size:11px;color:#7b8490;margin-top:3px}.scan-scores{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.scan-score{background:#f7f8fa;border-radius:9px;padding:6px 8px;text-align:center;min-width:62px}.scan-score span{display:block;color:#7b8490;font-size:10px}.scan-score b{font-size:16px}.scan-ok{font-size:10px;color:#137333;background:#d9f7df;border-radius:999px;padding:3px 6px}@media(max-width:520px){.scan-row{grid-template-columns:24px 1fr}.scan-scores{grid-column:2;justify-content:flex-start}}</style>

<h1>AEL｜股票基本面驾驶舱</h1><div class="sub">美股 · 港股 · A股｜AEL设计版权 © 所有</div>
<div class="search"><input id="symbol" placeholder="输入 AAPL / 600519 / 0700" value="AAPL"><button onclick="loadStock()">查询</button></div>
<div id="status" class="status">输入股票代码后查询</div>
<div class="card" id="market-scan-card"><div class="scan-head"><div><div class="section" style="margin-bottom:3px">🔭 AEL MARKET SCAN</div><div class="muted">主动发起｜只在点击后扫描｜结果短期缓存</div></div><button id="scanBtn" class="scan-btn" onclick="runMarketScan()">开始扫描</button></div><div class="scan-filters"><button class="scan-filter active" data-market="us" onclick="toggleScanMarket(this)">美股</button><button class="scan-filter active" data-market="hk" onclick="toggleScanMarket(this)">港股</button><button class="scan-filter active" data-market="cn" onclick="toggleScanMarket(this)">A股</button></div><div id="scanStatus" class="status">默认扫描 AEL 内置候选池；不会在打开页面时自动运行。综合评分 = 技术强势分×50% + 技术价值分×50%。</div><div id="scanResults"></div></div>
<div id="app"></div></div>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
const n=(x,d=2)=>x==null||!Number.isFinite(Number(x))?"暂无数据":Number(x).toLocaleString("zh-CN",{maximumFractionDigits:d});
const pct=x=>x==null?"暂无数据":`${n(x)}%`; const money=x=>{if(x==null||!Number.isFinite(Number(x)))return "暂无数据";const v=Number(x),a=Math.abs(v),u=a>=1e12?[1e12,"T"]:a>=1e9?[1e9,"B"]:a>=1e6?[1e6,"M"]:a>=1e3?[1e3,"K"]:[1,""];const num=v/u[0];return `${num.toLocaleString("zh-CN",{minimumFractionDigits:a>=1e3?2:0,maximumFractionDigits:2})}${u[1]}`;};
const metric=(a,b)=>`<div class="metric"><span>${a}</span><b>${b}</b></div>`; const stat=(a,b)=>`<div class="stat"><span>${a}</span><b>${b}</b></div>`;
function lineChart(rows){if(!rows.length)return '<div class="empty">暂无足够数据</div>';const W=700,H=250,L=45,R=15,T=18,B=34,vals=rows.map(r=>r.roe),min=Math.min(...vals),max=Math.max(...vals),pad=Math.max((max-min)*.15,1),lo=min-pad,hi=max+pad,x=i=>L+i*(W-L-R)/Math.max(rows.length-1,1),y=v=>T+(hi-v)*(H-T-B)/(hi-lo),pts=rows.map((r,i)=>`${x(i)},${y(r.roe)}`).join(" ");const labels=rows.map((r,i)=>`<text x="${x(i)}" y="${H-10}" text-anchor="middle" font-size="11" fill="#6b7280">${r.year}</text>`).join("");const dots=rows.map((r,i)=>`<circle cx="${x(i)}" cy="${y(r.roe)}" r="3.5" fill="#111827"><title>${r.year}: ${n(r.roe)}%</title></circle>`).join("");return `<div class="chartbox"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="#111827" stroke-width="2.5"/>${dots}${labels}</svg></div>`}
function dividendCard(d){const label=d.status==='no_dividend'?'无现金股息':(d.status==='unavailable'?'数据不可用':'有现金股息');return `<div class="card"><div class="section">分红与股东回报</div><div class="status">状态：${label}</div><div class="grid">${metric("TTM股息率",pct(d.dividend_yield))}${metric("5Y股息CAGR",pct(d.cagr_5y))}${metric("10Y股息CAGR",pct(d.cagr_10y))}${metric("连续分红",d.status==='no_dividend'?'0年':(d.consecutive_years?d.consecutive_years+"年":"暂无数据"))}${metric("净利润支付率",pct(d.dividend_payout_ratio))}${metric("FCF支付率",pct(d.fcf_payout_ratio))}${metric("回购金额",money(d.buybacks))}${metric("股东总支付率",pct(d.shareholder_payout_ratio))}</div><div class="status">最新年度：${esc(d.latest_period||"暂无数据")}｜完整年度CAGR不使用当前未结束年度。股息趋势：${esc(d.trend)}。支付率优先使用现金流数据计算；缺失时显示暂无数据。</div></div>`}
function techPriceChart(t){
 const c=t.price_chart||{},r=t.resonance||{};
 if(!c.available||!c.points?.length)return '<div class="empty">暂无足够历史 OHLC 数据</div>';
 const pts=c.points,bb=c.bollinger_points||[];
 const W=760,H=390,L=48,R=56,T=18,B=52,VH=62,plotH=H-T-B-VH;
 const all=pts.flatMap(p=>[p.high,p.low]).filter(Number.isFinite).concat(bb.flatMap(p=>[p.upper,p.lower]).filter(Number.isFinite));
 if(!all.length)return '<div class="empty">暂无足够历史 OHLC 数据</div>';
 const lo=Math.min(...all),hi=Math.max(...all),pad=Math.max((hi-lo)*.055,.01),yLo=lo-pad,yHi=hi+pad;
 const x=i=>L+(i+.5)*(W-L-R)/pts.length;
 const y=v=>T+(yHi-v)*(plotH)/(yHi-yLo);
 const volMax=Number(c.volume_max)||0,candleW=Math.max(2.5,Math.min(7,(W-L-R)/pts.length*.58));
 const gridN=5,grid=[];
 for(let j=0;j<=gridN;j++){const yy=T+j*plotH/gridN,p=yHi-(yHi-yLo)*j/gridN;grid.push(`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="#e8ebef" stroke-width="1"/><text x="${W-R+7}" y="${yy+4}" font-size="10" fill="#7b8490">${n(p)}</text>`)}
 const xlabels=[0,Math.floor(pts.length*.25),Math.floor(pts.length*.5),Math.floor(pts.length*.75),pts.length-1].filter((v,i,a)=>a.indexOf(v)===i).map(i=>`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="#7b8490">${pts[i].date.slice(5)}</text>`).join('');
 const lineSeries=(arr,key,stroke,dash='')=>{const map=new Map(arr.map((p,i)=>[p.date,{i,v:Number(p[key])}]));const out=[];pts.forEach((p)=>{const q=map.get(p.date);if(q&&Number.isFinite(q.v))out.push(`${x(q.i)},${y(q.v)}`)});return out.length?`<polyline points="${out.join(' ')}" fill="none" stroke="${stroke}" stroke-width="1.6" ${dash?`stroke-dasharray="${dash}"`:''}/>`:''};
 const bbLine=key=>lineSeries(bb,key,'#a6adb6','4 4');

 let candles='',vols='',titles='',icons='';
 pts.forEach((p,i)=>{
   const up=p.close>=p.open,stroke=up?'#e84d5b':'#159a68',bodyTop=y(Math.max(p.open,p.close)),bodyBot=y(Math.min(p.open,p.close)),bodyH=Math.max(1.4,bodyBot-bodyTop);
   candles+=`<line x1="${x(i)}" x2="${x(i)}" y1="${y(p.high)}" y2="${y(p.low)}" stroke="${stroke}" stroke-width="1.2"/><rect x="${x(i)-candleW/2}" y="${bodyTop}" width="${candleW}" height="${bodyH}" fill="${up?'#e84d5b':'#159a68'}" rx="0.7"/>`;
   if(Number.isFinite(p.volume)&&volMax>0){const vh=Math.max(1,(Number(p.volume)/volMax)*VH);vols+=`<rect x="${x(i)-candleW/2}" y="${H-B-vh}" width="${candleW}" height="${vh}" fill="${up?'#e84d5b':'#159a68'}" opacity=".35"/>`}
   if(i===pts.length-1) titles+=`<circle cx="${x(i)}" cy="${y(p.close)}" r="3.5" fill="#111827"><title>${p.date} 开 ${n(p.open)} 高 ${n(p.high)} 低 ${n(p.low)} 收 ${n(p.close)}</title></circle>`;
 });
 const dateIndex=new Map(pts.map((p,i)=>[p.date,i]));
 const line=(v,label,cls)=>v==null?'':`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="${cls}" stroke-width="1.2" stroke-dasharray="6 5"/><text x="${W-R+6}" y="${y(v)-4}" font-size="9" fill="${cls}">${label} ${n(v)}</text>`;
 const sup=r.support?.[0],res=r.resistance?.[0],last=pts[pts.length-1];
 return `<div class="kchart">
   <div class="khead"><div><b>日K</b><span> · 最近120个交易日</span></div><div>O ${n(last.open)}　H ${n(last.high)}　L ${n(last.low)}　C ${n(last.close)}</div></div>
   <div class="klegend"><span><i style="background:#e84d5b"></i>上涨</span><span><i style="background:#159a68"></i>下跌</span><span><i style="background:#7c8794"></i>布林</span></div>
   <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="AEL 日K线图">
     <rect x="${L}" y="${T}" width="${W-L-R}" height="${plotH}" fill="#fbfcfd"/>${grid.join('')}
     <line x1="${L}" x2="${W-R}" y1="${H-B-VH}" y2="${H-B-VH}" stroke="#dfe3e8"/>
     ${bbLine('upper')}${bbLine('lower')}
     ${candles}${vols}${line(c.current,'现价','#111827')}${line(sup?.price,'支撑','#64748b')}${line(res?.price,'压力','#64748b')}${titles}${xlabels}
     <text x="${L}" y="${H-B-VH+14}" font-size="9" fill="#8a929d">成交量</text>
   </svg>
   <div class="kfoot">K线颜色按中国行情软件习惯：红涨绿跌；虚线为布林带。MA仅用于技术指标计算与评分，不绘制在K线主图。</div>
 </div>`;
}

function resonanceHtml(r){const one=(x)=>`<div class="res-item"><b>${n(x.price)}</b><span>${esc(x.pivot)} + ${esc(x.bollinger)}</span><em>相差 ${x.distance_pct>=0?'+':''}${n(x.distance_pct,2)}% · 允许范围 ±1%</em></div>`;return `<div class="res-title" style="margin-top:14px">枢轴点 / 布林带共振</div><div class="status" style="margin-top:6px">R1/R2/R3 ↔ 布林上轨｜轴心点 ↔ 布林中轨｜S1/S2/S3 ↔ 布林下轨；两者价格相差不超过 1% 即判定为共振。</div><div class="res-grid"><div><div class="res-title">共振支撑</div>${(r.support||[]).length?(r.support||[]).map(one).join(''):'<div class="empty">暂无</div>'}</div><div><div class="res-title">共振压力 / 阻力</div>${(r.resistance||[]).length?(r.resistance||[]).map(one).join(''):'<div class="empty">暂无</div>'}</div></div>`}
function pivotTable(p){
 const c=p.classic||{},f=p.fibonacci||{};
 if(!p.available)return '<div class="empty">暂无足够的日线 OHLC 数据</div>';
 const rows=[['R3','green'],['R2','green'],['R1','green'],['轴心点','neutral'],['S1','red'],['S2','red'],['S3','red']];
 return `<div class="pivot-date"><span>轴点</span><span>${esc(p.date||'')}</span></div><div class="pivot-wrap"><table class="pivot-table"><thead><tr><th>线</th><th>经典</th><th>斐波纳契</th></tr></thead><tbody>${rows.map(([k,cls])=>`<tr><td>${k}</td><td class="pivot-${cls}">${n(c[k])}</td><td class="pivot-${cls}">${n(f[k])}</td></tr>`).join('')}</tbody></table></div>`;
}
function techCard(t){
 const i=t.indicators||{},fib=t.fibonacci||{},p=t.pivots||{},r=t.resonance||{},sb=t.score_breakdown||{},vb=t.value_breakdown||{};
 const fibItems=Object.entries(fib.levels||{}).map(([k,v])=>`<div class="fib-item"><span>${k}</span><b>${n(v)}</b></div>`).join('');
 const scoreRows=(sb.components||[]).map(x=>`<div class="status" style="display:flex;justify-content:space-between"><span>${esc(x.name)} · ${x.weight}%</span><b>${n(x.score,0)}</b></div>`).join('');
 return `<div class="card"><div class="section">技术分析</div>
 <div class="two">
   <div><div class="muted">技术强势分</div><div class="score">${n(t.score,0)}</div><div class="muted">状态：${esc(t.state)}</div></div>
   <div><div class="muted">技术价值分</div><div class="score">${n(t.value_score,0)}</div><div class="muted">状态：${esc(t.value_state)}</div></div>
 </div>
 <div class="chips" style="margin-top:10px">${(t.signals||[]).slice(-7).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div>
 ${techPriceChart(t)}
 <div class="metric" style="margin-top:10px"><span>综合评分</span><b>${n(t.composite_score,0)}</b><div class="muted">${esc(t.composite_state||'暂无数据')} · 技术强势分 50% + 技术价值分 50%</div></div>
 <div class="section" style="margin-top:14px">评分权重</div>
 <div class="status">强势评分：均线结构 25% · MACD动能 20% · RSI动能 15% · 20日动量 15% · 52周位置 15% · 量能 10%</div>
 <div class="grid">${(sb.components||[]).map(x=>metric(x.name,`${n(x.score,0)} / ${x.weight}%`)).join('')||'<div class="empty">暂无评分数据</div>'}</div>
 <div class="section" style="margin-top:14px">技术价值分怎么算</div>
 <div class="status">固定五项各 20%。RSI 看超买超卖位置；KDJ J&lt;0 获得明确超卖加分；MACD 同时看柱体位置与改善方向；Fib S3 与当前价格越接近，支撑项得分越高；BOLL 下轨同理。缺失数据不估算。</div>
 <div class="grid">${(vb.components||[]).map(x=>metric(x.name,`${n(x.score,0)} / ${x.weight}%`)).join('')||'<div class="empty">暂无评分明细</div>'}</div>
 <div class="status">${esc(vb.formula||'技术价值分 = RSI×20% + KDJ J×20% + MACD×20% + Fib S3×20% + BOLL下轨×20%')}</div>
 <div class="grid">${metric('RSI14',n(i.rsi14,1))}${metric('KDJ J',n(i.kdj_j,1))}${metric('MACD柱',n(i.macd_hist,3))}${metric('斐波纳契轴点S3',n((p.fibonacci||{}).S3))}${metric('布林下轨',n(i.bb_lower))}${metric('20日动量',pct(i.momentum_20d))}</div>
 <div class="section" style="margin-top:14px">均线（仅作指标，不绘制在K线）</div>
 <div class="grid">${metric('MA20',n(i.ma20))}${metric('MA60',n(i.ma60))}${metric('MA120',n(i.ma120))}${metric('MA250',n(i.ma250))}</div>
 <div class="section" style="margin-top:12px">布林带（20日，±2σ）</div><div class="grid">${metric('布林上轨',n(i.bb_upper))}${metric('布林中轨',n(i.bb_mid))}${metric('布林下轨',n(i.bb_lower))}${metric('布林位置',i.bollinger_position==null?'暂无数据':pct(i.bollinger_position*100))}</div>
 <div class="section" style="margin-top:12px">轴点</div>${pivotTable(p)}
 <div class="section" style="margin-top:14px">斐波那契回撤支撑 / 压力</div><div class="fib-grid">${fibItems||'<div class="empty">暂无足够历史行情数据</div>'}</div>${resonanceHtml(r)}
 <div class="status">最近斐波回撤支撑：${fib.nearest_support?`${esc(fib.nearest_support.level)} · ${n(fib.nearest_support.price)}`:'暂无数据'}｜最近斐波回撤压力：${fib.nearest_resistance?`${esc(fib.nearest_resistance.level)} · ${n(fib.nearest_resistance.price)}`:'暂无数据'}</div>
 <div class="note">XA未来函数已撤除。MA保留用于指标与评分，但不再绘制在K线主图。强势评分与技术性价比分开计算：前者衡量当前趋势/动能，后者衡量当前价格位置与潜在技术支撑带来的相对性价比；两者都不是买卖建议。</div></div>`
}
function analystBars(a){const r=a.rating||{},items=[['强力买入',r.strongBuy||0],['买入',r.buy||0],['持有',r.hold||0],['卖出',r.sell||0],['强力卖出',r.strongSell||0]];const max=Math.max(...items.map(x=>Number(x[1])||0),1),W=700,H=190,L=90,R=35,T=15,B=30,rowH=30;let body='';items.forEach((it,idx)=>{const y=T+idx*rowH+6,w=(Number(it[1])||0)/max*(W-L-R);body+=`<text x="${L-8}" y="${y+10}" text-anchor="end" font-size="11" fill="#6b7280">${it[0]}</text><rect x="${L}" y="${y}" width="${w}" height="18" rx="5" fill="#111827"/><text x="${Math.min(L+w+7,W-R)}" y="${y+13}" font-size="11" fill="#15191e">${n(it[1],0)}</text>`});return `<div class="analyst-chart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${body}</svg></div>`}
function targetBar(current,t){const mean=finiteNumber(t.mean),low=finiteNumber(t.low),high=finiteNumber(t.high);if(current==null||mean==null)return '';const lo=Math.min(current,low??current,high??current,mean),hi=Math.max(current,low??current,high??current,mean);if(hi<=lo)return '';const span=hi-lo,pos=v=>Math.max(0,Math.min(100,(v-lo)/span*100));const mark=(v,label,extra='')=>`<span class="label ${extra}" style="left:${pos(v)}%">${label} ${n(v)}</span><span class="marker" style="left:${pos(v)}%"></span>`;return `<div class="target-box"><b>当前价与分析师目标价</b><div class="target-line"><span class="track"></span>${mark(current,'现价','current')}${low!=null?mark(low,'低'):''}${mean!=null?mark(mean,'均值'):''}${high!=null?mark(high,'高','edge-right'):''}</div></div>`}

function finiteNumber(x){const v=Number(x);return Number.isFinite(v)?v:null}
function newsCard(items){
 const arr=Array.isArray(items)?items:[];
 const tag=x=>x==='利好'?'<span class="news-tag pos">利好</span>':x==='利空'?'<span class="news-tag neg">利空</span>':'<span class="news-tag neu">中性</span>';
 if(!arr.length)return `<div class="card"><div class="section">公司新闻</div><div class="news-empty">暂无可用新闻数据</div></div>`;
 return `<div class="card"><div class="section">公司新闻</div><div class="news-list">${arr.map(x=>`<div class="news-item"><div class="news-top">${tag(x.sentiment)}<span class="news-meta">${esc(x.publisher||'新闻来源')}${x.published_at?' · '+esc(x.published_at):''}</span></div><a class="news-title" href="${esc(x.link)}" target="_blank" rel="noopener noreferrer">${esc(x.title_zh||x.title)}</a></div>`).join('')}</div><div class="news-note">新闻来自 Yahoo Finance 新闻检索；标题已自动翻译为简体中文，来源名称也尽量转换为中文。点击标题可跳转原文。新闻“利好/利空/中性”为标题关键词自动归类，仅用于快速浏览，不代表事实判断或投资建议。</div></div>`;
}
function analystCard(a,current){if(!a.available)return `<div class="card"><div class="section">分析师观点</div><div class="empty">当前免费数据源未提供该标的的有效分析师数据，暂无数据，不人为补齐。</div></div>`;const r=a.rating||{},t=a.targets||{},e=a.earnings||{},rv=a.revenue||{};return `<div class="card"><div class="section">分析师观点</div>${analystBars(a)}<div class="rating-legend"><span class="legend-dot"><i></i>评级家数</span><span class="legend-dot">覆盖度：${n(e.numberOfAnalysts||rv.numberOfAnalysts,0)} 家</span></div>${targetBar(current,t)}<div class="grid">${metric('强力买入',n(r.strongBuy,0))}${metric('买入',n(r.buy,0))}${metric('持有',n(r.hold,0))}${metric('卖出',n(r.sell,0))}${metric('目标价均值',n(t.mean))}${metric('目标价中位',n(t.median))}${metric('EPS分析师数',n(e.numberOfAnalysts,0))}${metric('营收分析师数',n(rv.numberOfAnalysts,0))}</div><div class="status">评级、目标价及盈利预期来自免费数据源；不同市场的覆盖度可能不同。</div></div>`}
function renderStock(d,status,app){try{const v=d.valuation||{},f=d.fundamentals||{},rs=(d.roe_15y||{stats:{},years:[]}).stats||{},rows=(d.roe_15y||{years:[]}).years||[];app.innerHTML=`<div class="card"><div class="company"><div><h2>${esc(d.company||d.symbol||"")}</h2><div class="muted">${esc(d.symbol||"")} · ${esc(d.exchange||"")} · ${esc(d.currency||"")}</div></div><div style="text-align:right"><div class="muted">最新价格</div><b>${n((d.market_data||{}).price)}</b></div></div></div><div id="async-company">${d.company_description?`<div class="card"><div class="section">公司简介</div><div class="company-desc">${esc(d.company_description)}</div><div class="status">公司简介已自动翻译为简体中文。</div></div>`:`<div class="card"><div class="section">公司简介</div><div class="empty">正在加载公司简介……</div></div>`}</div><div id="async-news">${Array.isArray(d.news)&&d.news.length?newsCard(d.news):`<div class="card"><div class="section">公司新闻</div><div class="news-empty">正在加载新闻……</div></div>`}</div><div class="card"><div class="section">核心估值</div><div class="grid">${metric("PE",n(v.pe))}${metric("PB",n(v.pb))}${metric("ROE（最新完整财年）",pct(v.roe))}${metric("ROE ÷ PB",n(v.roe_pb))}${metric("PE ÷ ROE",n(v.pe_roe))}</div></div><div class="card"><div class="section">基本面</div><div class="grid">${metric("营收",money(f.revenue))}${metric("净利润",money(f.net_income))}${metric("毛利率",pct(f.gross_margin))}${metric("自由现金流",money(f.free_cash_flow))}${metric("资产负债率",pct(f.debt_ratio))}${metric("负债/权益",n(f.debt_to_equity))}</div></div>${dividendCard(d.dividends||{})}${techCard(d.technical||{})}${analystCard(d.analysts||{},(d.market_data||{}).price)}<div class="card"><div class="section">数据源状态</div><div class="chips">${Object.entries((d.source||{}).status||{}).map(([k,v])=>`<span class="chip">${esc(k)}：${v===true||v==='has_dividend'?'正常':(v==='no_dividend'?'无现金股息':'暂无')}</span>`).join('')}</div><div class="status">核心行情已先返回；公司简介、新闻等补充数据独立加载。</div></div><div class="card"><div class="section">近15年年度 ROE</div><div class="stats">${stat("平均",pct(rs.average))}${stat("中位数",pct(rs.median))}${stat("标准差",pct(rs.std_dev))}${stat("极差",pct(rs.range))}${stat("最高",pct(rs.max))}${stat("最低",pct(rs.min))}</div>${lineChart(rows)}<div class="muted">有效年度：${rs.count||0}/15｜${esc(d.roe_15y?.definition||"")}</div></div><div class="card"><div class="section">年度 ROE 明细</div><table class="table"><thead><tr><th>财年</th><th>财年截止</th><th>净利润</th><th>平均权益</th><th>ROE</th></tr></thead><tbody>${rows.slice().reverse().map(x=>`<tr><td>${esc(x.fiscal_year||("FY"+x.year))}</td><td>${esc(x.fiscal_period_end||"-")}</td><td>${money(x.net_income)}</td><td>${money((x.equity_begin+x.equity_end)/2)}</td><td>${pct(x.roe)}</td></tr>`).join("")}</tbody></table></div>`;status.textContent="核心数据已加载"}catch(e){status.innerHTML=`<span class="error">${esc(e.message)}</span>`}}

async function loadStock(){const s=document.getElementById("symbol").value.trim(),status=document.getElementById("status"),app=document.getElementById("app");if(!s){status.textContent="请输入股票代码";return}status.textContent="正在获取核心数据……";app.innerHTML="";try{const r=await fetch(`/api/stock/core/${encodeURIComponent(s)}`),d=await r.json();if(!r.ok)throw new Error(d.detail||"查询失败");renderStock(d,status,app);fetch(`/api/stock/details/${encodeURIComponent(s)}`).then(async r=>{const full=await r.json();if(!r.ok)throw new Error(full.detail||"补充数据查询失败");renderStock(full,status,app);status.textContent="全部数据已加载"}).catch(e=>{status.textContent="核心数据已加载，补充数据部分失败";const c=document.getElementById("async-company"),nbox=document.getElementById("async-news");if(c)c.innerHTML='<div class="card"><div class="section">公司简介</div><div class="empty">暂时无法获取</div></div>';if(nbox)nbox.innerHTML='<div class="card"><div class="section">公司新闻</div><div class="news-empty">暂时无法获取</div></div>';});}catch(e){status.innerHTML=`<span class="error">${esc(e.message)}</span>`}}
let scanMarkets=new Set(["us","hk","cn"]);
function toggleScanMarket(btn){const m=btn.dataset.market;if(scanMarkets.has(m)){if(scanMarkets.size===1)return;scanMarkets.delete(m);btn.classList.remove("active")}else{scanMarkets.add(m);btn.classList.add("active")}}
function renderScanResults(data){const box=document.getElementById("scanResults"),arr=data.results||[];if(!arr.length){box.innerHTML='<div class="empty">当前扫描池没有符合条件且数据完整的标的。没有数据不会人为估算。</div>';return}box.innerHTML=arr.map((x,i)=>`<div class="scan-row" onclick="document.getElementById('symbol').value='${esc(x.symbol)}';loadStock()" style="cursor:pointer"><div class="scan-rank">${String(i+1).padStart(2,'0')}</div><div><div class="scan-name">${esc(x.company||x.symbol)} <span class="scan-ok">基本面 ✓</span></div><div class="scan-meta">${esc(x.symbol)} · ${esc(x.exchange||'')} · ${esc(x.currency||'')}</div></div><div class="scan-scores"><div class="scan-score"><span>综合评分</span><b>${n(x.composite_score,0)}</b></div><div class="scan-score"><span>技术强势</span><b>${n(x.strength,0)}</b></div><div class="scan-score"><span>技术价值</span><b>${n(x.value_score,0)}</b></div></div></div>`).join('')}
async function runMarketScan(){const btn=document.getElementById("scanBtn"),st=document.getElementById("scanStatus"),box=document.getElementById("scanResults");const markets=[...scanMarkets].join(',');btn.disabled=true;btn.textContent="扫描中…";box.innerHTML="";st.textContent="正在扫描 AEL 候选池｜最多 4 路并发，单股查询仍可继续使用。";try{const r=await fetch(`/api/market-scan?markets=${encodeURIComponent(markets)}&limit=20&force=true`),d=await r.json();if(!r.ok)throw new Error(d.detail||"扫描失败");renderScanResults(d);st.textContent=`扫描完成｜扫描池 ${d.scan?.universe_size||0} 只｜发现 ${d.scan?.matched||0} 个符合条件${d.cached?'｜缓存结果':''}`;}catch(e){st.innerHTML=`<span class="error">${esc(e.message)}</span>`}finally{btn.disabled=false;btn.textContent="重新扫描"}}
document.getElementById("symbol").addEventListener("keydown",e=>{if(e.key==="Enter")loadStock()});
</script></body></html>
