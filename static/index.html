<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AEL｜股票基本面驾驶舱</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f4f6f8;color:#15191e}*{box-sizing:border-box}body{margin:0;background:#f4f6f8}.wrap{max-width:820px;margin:auto;padding:16px}h1{font-size:25px;margin:6px 0 4px}.sub{color:#6b7280;font-size:13px;margin-bottom:16px}.search{display:flex;gap:8px}.search input{flex:1;min-width:0;border:1px solid #d5d9df;border-radius:12px;padding:13px;font-size:16px;background:#fff}.search button{border:0;border-radius:12px;padding:0 18px;font-size:15px;background:#111827;color:#fff}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:16px;margin-top:12px;box-shadow:0 2px 10px #00000008}.company{display:flex;justify-content:space-between;gap:10px}.company h2{margin:0;font-size:20px}.muted,.note{color:#6b7280;font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px}.metric{border:1px solid #edf0f2;border-radius:12px;padding:12px}.metric b{display:block;font-size:20px;margin-top:5px}.metric span{font-size:12px;color:#6b7280}.section{font-size:15px;font-weight:700;margin-bottom:10px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f7f8fa;border-radius:10px;padding:9px}.stat span{display:block;color:#6b7280;font-size:11px}.stat b{font-size:16px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{background:#f7f8fa;border-radius:999px;padding:6px 9px;font-size:12px}.chartbox{width:100%;overflow:hidden}.chartbox svg{width:100%;height:250px;display:block}.status{margin-top:10px;color:#6b7280;font-size:12px}.error{color:#b42318}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:8px 4px;border-bottom:1px solid #eee;text-align:right}.table th:first-child,.table td:first-child{text-align:left}.score{font-size:34px;font-weight:800}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.empty{padding:10px;background:#f7f8fa;border-radius:10px;color:#6b7280;font-size:13px}@media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}}
.company-desc{font-size:13px;line-height:1.7;color:#374151;white-space:pre-wrap}.res-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.res-title{font-size:12px;font-weight:700;margin-bottom:6px}.res-item{background:#f7f8fa;border-radius:10px;padding:8px;margin-bottom:6px}.res-item b{display:block;font-size:15px}.res-item span{display:block;color:#6b7280;font-size:11px;margin-top:2px}.res-item em{display:block;font-style:normal;color:#6b7280;font-size:10px;margin-top:2px}.mini-chart{width:100%;overflow:hidden;margin-top:12px}.mini-chart svg{width:100%;height:250px;display:block}.fib-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}.fib-item{background:#f7f8fa;border-radius:10px;padding:8px}.fib-item span{display:block;color:#6b7280;font-size:11px}.fib-item b{font-size:15px}.analyst-chart{margin-top:12px}.analyst-chart svg{width:100%;height:190px;display:block}.rating-legend{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.legend-dot{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#6b7280}.legend-dot i{width:8px;height:8px;border-radius:50%;display:inline-block;background:#111827}.target-box{margin-top:10px;padding:10px;background:#f7f8fa;border-radius:10px;font-size:12px}.target-line{position:relative;height:30px;margin-top:6px}.target-line .track{position:absolute;left:0;right:0;top:14px;height:2px;background:#dfe3e8}.target-line .marker{position:absolute;top:8px;width:2px;height:14px;background:#111827}.target-line .label{position:absolute;top:0;font-size:10px;transform:translateX(-50%);white-space:nowrap}.target-line .label.current{font-weight:700}.target-line .label.edge-left{transform:none}.target-line .label.edge-right{transform:translateX(-100%)}</style>
</head><body><div class="wrap">
<h1>AEL｜股票基本面驾驶舱</h1><div class="sub">美股 · 港股 · A股｜AEL设计版权 © 所有</div>
<div class="search"><input id="symbol" placeholder="输入 AAPL / 600519 / 0700" value="AAPL"><button onclick="loadStock()">查询</button></div>
<div id="status" class="status">输入股票代码后查询</div><div id="app"></div></div>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
const n=(x,d=2)=>x==null||!Number.isFinite(Number(x))?"暂无数据":Number(x).toLocaleString("zh-CN",{maximumFractionDigits:d});
const pct=x=>x==null?"暂无数据":`${n(x)}%`; const money=x=>{if(x==null||!Number.isFinite(Number(x)))return "暂无数据";const v=Number(x),a=Math.abs(v),u=a>=1e12?[1e12,"T"]:a>=1e9?[1e9,"B"]:a>=1e6?[1e6,"M"]:a>=1e3?[1e3,"K"]:[1,""];const num=v/u[0];return `${num.toLocaleString("zh-CN",{minimumFractionDigits:a>=1e3?2:0,maximumFractionDigits:2})}${u[1]}`;};
const metric=(a,b)=>`<div class="metric"><span>${a}</span><b>${b}</b></div>`; const stat=(a,b)=>`<div class="stat"><span>${a}</span><b>${b}</b></div>`;
function lineChart(rows){if(!rows.length)return '<div class="empty">暂无足够数据</div>';const W=700,H=250,L=45,R=15,T=18,B=34,vals=rows.map(r=>r.roe),min=Math.min(...vals),max=Math.max(...vals),pad=Math.max((max-min)*.15,1),lo=min-pad,hi=max+pad,x=i=>L+i*(W-L-R)/Math.max(rows.length-1,1),y=v=>T+(hi-v)*(H-T-B)/(hi-lo),pts=rows.map((r,i)=>`${x(i)},${y(r.roe)}`).join(" ");const labels=rows.map((r,i)=>`<text x="${x(i)}" y="${H-10}" text-anchor="middle" font-size="11" fill="#6b7280">${r.year}</text>`).join("");const dots=rows.map((r,i)=>`<circle cx="${x(i)}" cy="${y(r.roe)}" r="3.5" fill="#111827"><title>${r.year}: ${n(r.roe)}%</title></circle>`).join("");return `<div class="chartbox"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="#111827" stroke-width="2.5"/>${dots}${labels}</svg></div>`}
function dividendCard(d){const label=d.status==='no_dividend'?'无现金股息':(d.status==='unavailable'?'数据不可用':'有现金股息');return `<div class="card"><div class="section">分红与股东回报</div><div class="status">状态：${label}</div><div class="grid">${metric("TTM股息率",pct(d.dividend_yield))}${metric("5Y股息CAGR",pct(d.cagr_5y))}${metric("10Y股息CAGR",pct(d.cagr_10y))}${metric("连续分红",d.status==='no_dividend'?'0年':(d.consecutive_years?d.consecutive_years+"年":"暂无数据"))}${metric("净利润支付率",pct(d.dividend_payout_ratio))}${metric("FCF支付率",pct(d.fcf_payout_ratio))}${metric("回购金额",money(d.buybacks))}${metric("股东总支付率",pct(d.shareholder_payout_ratio))}</div><div class="status">最新年度：${esc(d.latest_period||"暂无数据")}｜完整年度CAGR不使用当前未结束年度。股息趋势：${esc(d.trend)}。支付率优先使用现金流数据计算；缺失时显示暂无数据。</div></div>`}
function techPriceChart(t){const c=t.price_chart||{},r=t.resonance||{};if(!c.available||!c.points?.length)return '<div class="empty">暂无足够历史行情数据</div>';const pts=c.points,bb=c.bollinger_points||[],W=700,H=280,L=45,R=18,T=18,B=30,vals=pts.map(x=>x.price).concat(bb.flatMap(x=>[x.upper,x.lower]).filter(Number.isFinite)).concat([c.support?.price||0,c.resistance?.price||0]);const finiteVals=vals.filter(Number.isFinite),lo=Math.min(...finiteVals),hi=Math.max(...finiteVals),pad=Math.max((hi-lo)*.08,0.01),yLo=lo-pad,yHi=hi+pad,x=i=>L+i*(W-L-R)/Math.max(pts.length-1,1),y=v=>T+(yHi-v)*(H-T-B)/(yHi-yLo),line=pts.map((p,i)=>`${x(i)},${y(p.price)}`).join(' '),bbLine=(key)=>bb.map((p,i)=>Number.isFinite(p[key])?`${x(i)},${y(p[key])}`:null).filter(Boolean).join(' '),hline=(v,label,cls)=>v==null?'':`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="${cls}" stroke-width="1.8" stroke-dasharray="6 5"/><text x="${W-R}" y="${y(v)-5}" text-anchor="end" font-size="11" fill="${cls}">${label} ${n(v)}</text>`;const res=r.resistance?.[0],sup=r.support?.[0];return `<div class="mini-chart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polyline points="${bbLine('upper')}" fill="none" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4"/><polyline points="${bbLine('lower')}" fill="none" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4"/><polyline points="${line}" fill="none" stroke="#111827" stroke-width="2.4"/>${hline(c.current,'现价','#111827')}${hline(sup?.price,`共振支撑 ${sup?.count||''}项`,'#6b7280')}${hline(res?.price,`共振压力 ${res?.count||''}项`,'#6b7280')}<circle cx="${x(pts.length-1)}" cy="${y(c.current)}" r="4" fill="#111827"/><text x="${L}" y="${H-8}" font-size="10" fill="#6b7280">近120个交易日 · 虚线=布林带</text></svg></div>`}
function resonanceHtml(r){const one=(x)=>`<div class="res-item"><b>${n(x.price)}</b><span>${x.sources.join(' + ')}</span><em>${x.count}项共振 · ${x.distance_pct>=0?'+':''}${n(x.distance_pct,2)}%</em></div>`;return `<div class="res-grid"><div><div class="res-title">共振支撑</div>${(r.support||[]).length?(r.support||[]).map(one).join(''):'<div class="empty">暂无</div>'}</div><div><div class="res-title">共振压力 / 阻力</div>${(r.resistance||[]).length?(r.resistance||[]).map(one).join(''):'<div class="empty">暂无</div>'}</div></div>`}
function techCard(t){const i=t.indicators||{},fib=t.fibonacci||{},r=t.resonance||{};const fibItems=Object.entries(fib.levels||{}).map(([k,v])=>`<div class="fib-item"><span>${k}</span><b>${n(v)}</b></div>`).join('');return `<div class="card"><div class="section">技术分析</div><div class="two"><div><div class="score">${n(t.score,0)}</div><div class="muted">技术状态：${esc(t.state)}</div></div><div class="chips">${(t.signals||[]).slice(-7).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></div>${techPriceChart(t)}<div class="grid">${metric('MA20',n(i.ma20))}${metric('MA60',n(i.ma60))}${metric('MA120',n(i.ma120))}${metric('MA250',n(i.ma250))}${metric('RSI14',n(i.rsi14,1))}${metric('MACD',n(i.macd,3))}${metric('20日动量',pct(i.momentum_20d))}${metric('52周位置',pct(i['52w_position']))}</div><div class="section" style="margin-top:12px">布林带（20日，±2σ）</div><div class="grid">${metric('布林上轨',n(i.bb_upper))}${metric('布林中轨',n(i.bb_mid))}${metric('布林下轨',n(i.bb_lower))}${metric('布林位置',i.bollinger_position==null?'暂无数据':pct(i.bollinger_position*100))}</div><div class="section" style="margin-top:12px">斐波那契支撑 / 压力</div><div class="fib-grid">${fibItems||'<div class="empty">暂无足够历史行情数据</div>'}</div>${resonanceHtml(r)}<div class="status">最近斐波支撑：${fib.nearest_support?`${esc(fib.nearest_support.level)} · ${n(fib.nearest_support.price)}`:'暂无数据'}｜最近斐波压力：${fib.nearest_resistance?`${esc(fib.nearest_resistance.level)} · ${n(fib.nearest_resistance.price)}`:'暂无数据'}</div><div class="note">斐波那契按近252个交易日高低点计算；共振位仅统计斐波那契与布林带在1%价格范围内的重合区域，不等同于买入/卖出建议。</div></div>`}
function analystBars(a){const r=a.rating||{},items=[['强力买入',r.strongBuy||0],['买入',r.buy||0],['持有',r.hold||0],['卖出',r.sell||0],['强力卖出',r.strongSell||0]];const max=Math.max(...items.map(x=>Number(x[1])||0),1),W=700,H=190,L=90,R=35,T=15,B=30,rowH=30;let body='';items.forEach((it,idx)=>{const y=T+idx*rowH+6,w=(Number(it[1])||0)/max*(W-L-R);body+=`<text x="${L-8}" y="${y+10}" text-anchor="end" font-size="11" fill="#6b7280">${it[0]}</text><rect x="${L}" y="${y}" width="${w}" height="18" rx="5" fill="#111827"/><text x="${Math.min(L+w+7,W-R)}" y="${y+13}" font-size="11" fill="#15191e">${n(it[1],0)}</text>`});return `<div class="analyst-chart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${body}</svg></div>`}
function targetBar(current,t){const mean=finiteNumber(t.mean),low=finiteNumber(t.low),high=finiteNumber(t.high);if(current==null||mean==null)return '';const lo=Math.min(current,low??current,high??current,mean),hi=Math.max(current,low??current,high??current,mean);if(hi<=lo)return '';const span=hi-lo,pos=v=>Math.max(0,Math.min(100,(v-lo)/span*100));const mark=(v,label,extra='')=>`<span class="label ${extra}" style="left:${pos(v)}%">${label} ${n(v)}</span><span class="marker" style="left:${pos(v)}%"></span>`;return `<div class="target-box"><b>当前价与分析师目标价</b><div class="target-line"><span class="track"></span>${mark(current,'现价','current')}${low!=null?mark(low,'低'):''}${mean!=null?mark(mean,'均值'):''}${high!=null?mark(high,'高','edge-right'):''}</div></div>`}

function finiteNumber(x){const v=Number(x);return Number.isFinite(v)?v:null}
function analystCard(a,current){if(!a.available)return `<div class="card"><div class="section">分析师观点</div><div class="empty">当前免费数据源未提供该标的的有效分析师数据，暂无数据，不人为补齐。</div></div>`;const r=a.rating||{},t=a.targets||{},e=a.earnings||{},rv=a.revenue||{};return `<div class="card"><div class="section">分析师观点</div>${analystBars(a)}<div class="rating-legend"><span class="legend-dot"><i></i>评级家数</span><span class="legend-dot">覆盖度：${n(e.numberOfAnalysts||rv.numberOfAnalysts,0)} 家</span></div>${targetBar(current,t)}<div class="grid">${metric('强力买入',n(r.strongBuy,0))}${metric('买入',n(r.buy,0))}${metric('持有',n(r.hold,0))}${metric('卖出',n(r.sell,0))}${metric('目标价均值',n(t.mean))}${metric('目标价中位',n(t.median))}${metric('EPS分析师数',n(e.numberOfAnalysts,0))}${metric('营收分析师数',n(rv.numberOfAnalysts,0))}</div><div class="status">评级、目标价及盈利预期来自免费数据源；不同市场的覆盖度可能不同。</div></div>`}
async function loadStock(){const s=document.getElementById("symbol").value.trim(),status=document.getElementById("status"),app=document.getElementById("app");if(!s){status.textContent="请输入股票代码";return}status.textContent="正在获取数据……";app.innerHTML="";try{const r=await fetch(`/api/stock/${encodeURIComponent(s)}`),d=await r.json();if(!r.ok)throw new Error(d.detail||"查询失败");const v=d.valuation,f=d.fundamentals,rs=d.roe_15y.stats,rows=d.roe_15y.years;app.innerHTML=`<div class="card"><div class="company"><div><h2>${esc(d.company)}</h2><div class="muted">${esc(d.symbol)} · ${esc(d.exchange||"")} · ${esc(d.currency||"")}</div></div><div style="text-align:right"><div class="muted">最新价格</div><b>${n(d.market_data.price)}</b></div></div></div>${d.company_description?`<div class="card"><div class="section">公司介绍</div><div class="company-desc">${esc(d.company_description)}</div><div class="status">来源：免费行情资料中的公司业务简介；缺失时显示暂无数据。</div></div>`:''}<div class="card"><div class="section">核心估值</div><div class="grid">${metric("PE",n(v.pe))}${metric("PB",n(v.pb))}${metric("ROE（最新完整财年）",pct(v.roe))}${metric("ROE ÷ PB",n(v.roe_pb))}${metric("PE ÷ ROE",n(v.pe_roe))}</div></div><div class="card"><div class="section">基本面</div><div class="grid">${metric("营收",money(f.revenue))}${metric("净利润",money(f.net_income))}${metric("毛利率",pct(f.gross_margin))}${metric("自由现金流",money(f.free_cash_flow))}${metric("资产负债率",pct(f.debt_ratio))}${metric("负债/权益",n(f.debt_to_equity))}</div></div>${dividendCard(d.dividends)}${techCard(d.technical)}${analystCard(d.analysts,d.market_data.price)}<div class="card"><div class="section">数据源状态</div><div class="chips">${Object.entries(d.source.status||{}).map(([k,v])=>`<span class="chip">${esc(k)}：${v===true||v==='has_dividend'?'正常':(v==='no_dividend'?'无现金股息':'暂无')}</span>`).join('')}</div>${Object.keys(d.source.errors||{}).length?`<div class="status">部分数据源调用失败，已隔离，不影响其他模块。</div>`:'<div class="status">各模块独立取数。</div>'}</div><div class="card"><div class="section">近15年年度 ROE</div><div class="stats">${stat("平均",pct(rs.average))}${stat("中位数",pct(rs.median))}${stat("标准差",pct(rs.std_dev))}${stat("极差",pct(rs.range))}${stat("最高",pct(rs.max))}${stat("最低",pct(rs.min))}</div>${lineChart(rows)}<div class="muted">有效年度：${rs.count}/15｜${esc(d.roe_15y.definition)}｜核心ROE与年度明细统一使用最新完整财年；美股按SEC财年期末配对；数据源：${esc(d.roe_15y.source||"Yahoo Finance")}</div></div><div class="card"><div class="section">年度 ROE 明细</div><table class="table"><thead><tr><th>财年</th><th>财年截止</th><th>净利润</th><th>平均权益</th><th>ROE</th></tr></thead><tbody>${rows.slice().reverse().map(x=>`<tr><td>${esc(x.fiscal_year||("FY"+x.year))}</td><td>${esc(x.fiscal_period_end||"-")}</td><td>${money(x.net_income)}</td><td>${money((x.equity_begin+x.equity_end)/2)}</td><td>${pct(x.roe)}</td></tr>`).join("")}</tbody></table></div><div class="status">${esc(d.source.provider)}。数据缺失时不人为填充。</div>`;status.textContent="查询完成"}catch(e){status.innerHTML=`<span class="error">${esc(e.message)}</span>`}}
document.getElementById("symbol").addEventListener("keydown",e=>{if(e.key==="Enter")loadStock()});
</script></body></html>
